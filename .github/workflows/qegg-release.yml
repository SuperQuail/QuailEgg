name: QuailEgg Release
on:
  push:
    branches: ["main"]
    paths:
      - ".changes/**"
      - ".quailegg.toml"
      - ".quailegg/pre-release.lock"
      - ".quailegg/release.json"
      - "CHANGELOG.md"
      - "go.mod"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: qegg-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: true }
      - name: Install qegg (develop)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f go.mod ] && grep -q '^module github.com/SuperQuail/QuailEgg$' go.mod && [ -d cmd/qegg ]; then
            mkdir -p "$RUNNER_TEMP/bin"
            go build -o "$RUNNER_TEMP/bin/qegg" ./cmd/qegg
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          else
            go install github.com/SuperQuail/QuailEgg/cmd/qegg@main
          fi
      - name: Release
        run: qegg release --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
