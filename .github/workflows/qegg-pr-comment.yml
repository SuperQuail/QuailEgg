name: QuailEgg PR Comment
on:
  workflow_run:
    workflows: ["QuailEgg PR"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/qegg-pr.yml' &&
      github.event.workflow_run.head_repository.id != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: qegg-pr-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Find release plan
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: qegg-pr-plan-${{ github.event.workflow_run.run_attempt }}
        run: |
          artifact_id=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            -f "name=$ARTIFACT_NAME" \
            --jq '.artifacts | map(select(.expired == false)) |
              if length == 0 then empty
              elif length > 1 then error("multiple release plan artifacts")
              elif .[0].size_in_bytes > 1048576 then error("release plan archive exceeds 1 MiB")
              else .[0].id end')
          if [ -z "$artifact_id" ]; then
            echo "skipping the plan comment because there is no release plan artifact"
          else
            echo "id=$artifact_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release plan
        if: steps.artifact.outputs.id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          path: ${{ runner.temp }}/qegg-pr-plan
          skip-decompress: true
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Comment on release plan
        if: steps.artifact.outputs.id != ''
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: "main"
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from zipfile import ZIP_DEFLATED, ZIP_STORED, ZipFile

          REPO = os.environ["GITHUB_REPOSITORY"]
          BASE_BRANCH = os.environ["BASE_BRANCH"]
          PLAN_MARKER = "<!-- qegg:release-plan -->"
          MAX_COMMENT_CHARS = 65_536
          MAX_PLAN_BYTES = 4 * MAX_COMMENT_CHARS
          MAX_ARCHIVE_BYTES = 1 << 20

          def api(endpoint, *flags, body=None):
              args = ["gh", "api", f"repos/{REPO}/{endpoint}", *flags]
              payload = None
              if body is not None:
                  args.extend(("--input", "-"))
                  payload = json.dumps({"body": body})
              result = subprocess.run(
                  args, input=payload, stdout=subprocess.PIPE, encoding="utf-8", check=True
              )
              return json.loads(result.stdout)

          def matches_run(pull, run):
              head = pull["head"]
              return (
                  pull["state"] == "open"
                  and pull["base"]["ref"] == BASE_BRANCH
                  and (head["repo"] or {}).get("id") == run["head_repository"]["id"]
                  and head["ref"] == run["head_branch"]
                  and head["sha"] == run["head_sha"]
                  and pull["created_at"] <= run["created_at"]
              )

          def read_plan():
              directory = Path(os.environ["RUNNER_TEMP"]) / "qegg-pr-plan"
              files = list(directory.iterdir())
              if len(files) != 1 or not files[0].is_file() or files[0].stat().st_size > MAX_ARCHIVE_BYTES:
                  raise SystemExit("invalid release plan archive")
              # Read the expected member as data without extracting the archive.
              with ZipFile(files[0]) as archive:
                  entries = archive.infolist()
                  if len(entries) != 1 or entries[0].filename != "plan.md":
                      raise SystemExit("release plan archive must contain only plan.md")
                  entry = entries[0]
                  if entry.file_size > MAX_PLAN_BYTES or entry.compress_type not in (ZIP_STORED, ZIP_DEFLATED):
                      raise SystemExit("invalid release plan file size or compression")
                  with archive.open(entry) as member:
                      data = member.read(MAX_PLAN_BYTES + 1)
              if len(data) > MAX_PLAN_BYTES:
                  raise SystemExit("release plan exceeds the comment size limit")
              plan = data.decode("utf-8")
              if not plan.strip():
                  raise SystemExit("release plan is empty")
              return plan

          def main():
              with Path(os.environ["GITHUB_EVENT_PATH"]).open(encoding="utf-8") as event:
                  run = json.load(event)["workflow_run"]
              owner = run["head_repository"]["owner"]["login"]
              pulls = api(
                  "pulls", "--method", "GET", "--paginate", "--slurp",
                  "-f", "state=open", "-f", f"base={BASE_BRANCH}",
                  "-f", f"head={owner}:{run['head_branch']}",
              )
              matches = [pull for page in pulls for pull in page if matches_run(pull, run)]
              if len(matches) != 1:
                  print("skipping the plan comment because no unique open pull request matches this run")
                  return

              number = matches[0]["number"]
              workflow, revision, attempt = run["workflow_id"], run["run_number"], run["run_attempt"]
              body = f"{PLAN_MARKER}\n<!-- qegg:pr-run {workflow}/{revision}/{attempt} -->\n\n{read_plan()}"
              if len(body) > MAX_COMMENT_CHARS:
                  raise SystemExit("release plan exceeds the comment size limit")

              endpoint = f"issues/{number}/comments"
              pages = api(endpoint, "--paginate", "--slurp")
              existing = max(
                  (comment for page in pages for comment in page
                   if (comment["user"] or {}).get("login") == "github-actions[bot]"
                   and (comment["body"] or "").startswith(PLAN_MARKER + "\n")),
                  key=lambda comment: comment["id"], default=None,
              )
              if existing:
                  previous = re.fullmatch(r"<!-- qegg:pr-run (\d+)/(\d+)/(\d+) -->", existing["body"].split("\n", 2)[1])
                  if previous:
                      old_workflow, old_revision, old_attempt = map(int, previous.groups())
                      if old_workflow == workflow and (old_revision, old_attempt) > (revision, attempt):
                          print("a newer run already published a release plan")
                          return
                  if existing["body"] == body:
                      print("release plan comment is already current")
                      return

              if not matches_run(api(f"pulls/{number}"), run):
                  print("skipping the plan comment because the pull request changed")
                  return
              if existing:
                  api(f"issues/comments/{existing['id']}", "--method", "PATCH", body=body)
                  print(f"updated release plan comment on PR #{number}")
              else:
                  api(endpoint, "--method", "POST", body=body)
                  print(f"posted release plan comment on PR #{number}")

          main()
