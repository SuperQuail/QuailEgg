name: QuailEgg PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: qegg-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.head_ref != 'release'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: true }
      - name: Install qegg (develop)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f go.mod ] && grep -q '^module github.com/SuperQuail/QuailEgg$' go.mod && [ -d cmd/qegg ]; then
            mkdir -p "$RUNNER_TEMP/bin"
            go build -o "$RUNNER_TEMP/bin/qegg" ./cmd/qegg
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          else
            go install github.com/SuperQuail/QuailEgg/cmd/qegg@main
          fi
      - name: Check
        run: qegg check --ci
      - name: Preview
        run: |
          qegg plan --markdown > plan.md
          if [ -s plan.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none -F plan.md
          else
            echo "no pending release; skipping the plan comment"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
