# Generated by qegg. Keep this file in version control.
schema_version = 1

[project]
default_branch = "main"
repo = "github.com/SuperQuail/QuailEgg"

[git]
tag_prefix = "v"
remote = "origin"

[release]
mode = "commit"
github_release = true
commit_message = "chore(release): v{{version}}"

[changes]
dir = ".changes"
scope = ["cmd", "internal", "test"]

[verify]
commands = ["go test ./..."]
timeout = "15m"
fail_fast = true

[publish]
registries = ["go"]

[release.assets]
enabled = true

[packages."github.com/SuperQuail/QuailEgg"]
path = "."
resolver = "go"
publish = true
